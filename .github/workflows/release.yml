name: Release PartyBotUI Addon Zip

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Addon
        run: |
          mkdir -p PartyBotUI
          cp PartyBotUI.lua PartyBotUI.xml PartyBotUI.toc README.md PartyBotUI/ 2>/dev/null || true
          zip -r PartyBotUI.zip PartyBotUI

      - name: Publish Latest Release (Branch Push)
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PartyBotUI (Latest Build)"
          body: |
            Automated build from commit ${{ github.sha }} on `main` branch.

            ### Installation
            1. Download `PartyBotUI.zip` below.
            2. Extract directly into your `World of Warcraft/Interface/AddOns/` directory.
            3. Verify the extracted folder name is `PartyBotUI`.
            4. Run `/console reloadui` in game.
          draft: false
          prerelease: false
          files: PartyBotUI.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Tagged Release (Version Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "PartyBotUI ${{ github.ref_name }}"
          body: |
            PartyBotUI release ${{ github.ref_name }}.

            ### Installation
            1. Download `PartyBotUI.zip` below.
            2. Extract directly into your `World of Warcraft/Interface/AddOns/` directory.
            3. Verify the extracted folder name is `PartyBotUI`.
            4. Run `/console reloadui` in game.
          draft: false
          prerelease: false
          files: PartyBotUI.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
